<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 384" width="1280" height="384" role="img" aria-label="Nuniversity — interactive learning platform">
  <!-- Dark-theme hero. All styling/animation lives INSIDE the SVG because
       GitHub strips CSS/JS from Markdown; SVG files pass through camo as-is. -->
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#a5b4fc;#f0abfc;#60a5fa" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#e879f9">
        <animate attributeName="stop-color" values="#e879f9;#818cf8;#38bdf8;#e879f9" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <style>
      .orb { animation: float 11s ease-in-out infinite alternate; }
      .orb2 { animation: float2 14s ease-in-out infinite alternate; }
      @keyframes float  { from { transform: translate(0,0); }   to { transform: translate(70px,-34px); } }
      @keyframes float2 { from { transform: translate(0,0); }   to { transform: translate(-60px,40px); } }
      @media (prefers-reduced-motion: reduce) { .orb, .orb2 { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="384" fill="#0b1220"/>
  <circle class="orb"  cx="1180" cy="60"  r="150" fill="#3b82f6" opacity="0.22" filter="url(#soft)"/>
  <circle class="orb2" cx="120"  cy="330" r="170" fill="#a855f7" opacity="0.20" filter="url(#soft)"/>

  <!-- brand badge -->
  <rect x="64" y="52" width="124" height="78" rx="22" fill="#ffffff"/>
  <text x="126" y="108" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#3b82f6" text-anchor="middle">NU</text>

  <!-- identities, top-right -->
  <text x="1216" y="76"  font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#e2e8f0" text-anchor="end">github.com/nuniversity</text>
  <text x="1216" y="108" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#93c5fd" text-anchor="end">nuniversity.pages.dev</text>

  <!-- title + tagline -->
  <text x="64" y="216" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="bold" fill="url(#title)">Nuniversity</text>
  <rect x="66" y="238" width="286" height="5" rx="2.5" fill="url(#line)"/>
  <text x="64" y="292" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#cbd5e1">Learn, Code, and Grow</text>

  <!-- stat chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">
    <rect x="64"  y="318" width="196" height="50" rx="25" fill="#6366f1" opacity="0.30"/>
    <text x="162"  y="350" text-anchor="middle">49 courses</text>
    <rect x="276" y="318" width="220" height="50" rx="25" fill="#6366f1" opacity="0.30"/>
    <text x="386"  y="350" text-anchor="middle">1,300+ lessons</text>
    <rect x="512" y="318" width="224" height="50" rx="25" fill="#6366f1" opacity="0.30"/>
    <text x="624"  y="350" text-anchor="middle">3 languages</text>
    <rect x="752" y="318" width="248" height="50" rx="25" fill="#8b5cf6" opacity="0.34"/>
    <text x="876"  y="350" text-anchor="middle">0 ads · 0 tracking</text>
  </g>
</svg>
